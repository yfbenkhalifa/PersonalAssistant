services:
  backend:
    build:
      context: libraries/personal-assistant-agent
      dockerfile: Dockerfile
    container_name: personal-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - personal-assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: libraries/personal-assistant-frontend
      dockerfile: Dockerfile
    container_name: personal-assistant-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - personal-assistant-network
    restart: unless-stopped
    environment:
      - API_URL=http://backend:8000

networks:
  personal-assistant-network:
    driver: bridge

