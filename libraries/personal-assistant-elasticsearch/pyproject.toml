[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-elasticsearch"
version = "0.1.0"
description = "Reusable Elasticsearch client and API package extracted from PersonalAssistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Personal Assistant Team" }]
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "elasticsearch>=8.14,<9.0",
  "loguru>=0.7,<1.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "sentence-transformers>=3.0,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
ocr = ["paddleocr>=2.8,<3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
